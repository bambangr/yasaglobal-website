# Konfigurasi dasar Nginx untuk yasaglobal.id
# Lokasi di server: /etc/nginx/sites-available/yasaglobal
# Catatan: Certbot menambahkan blok HTTPS (listen 443, sertifikat, redirect)
# secara otomatis ke berkas di server. Berkas ini hanya dokumentasi versi dasar.
server {
    listen 80;
    server_name yasaglobal.id www.yasaglobal.id;

    root /var/www/yasaglobal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
